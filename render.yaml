services:
  - type: web
    name: mindsaathi-backend
    env: python
    rootDir: backend
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: DATABASE_URL
        sync: false          # Set manually in Render dashboard (Supabase URL)
      - key: ENVIRONMENT
        value: production
      - key: JWT_ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "1440"
      - key: REFRESH_TOKEN_EXPIRE_DAYS
        value: "7"
      - key: JWT_SECRET_KEY
        sync: false          # Set manually - use your existing JWT_SECRET_KEY
      - key: JOURNAL_ENCRYPTION_KEY
        sync: false          # Set manually - use your existing JOURNAL_ENCRYPTION_KEY
      - key: GEMINI_MODEL
        value: gemini-2.5-flash
      - key: GEMINI_API_KEY
        sync: false          # Set manually in Render dashboard
      - key: GEMINI_API_BASE_URL
        value: https://generativelanguage.googleapis.com
      - key: FRONTEND_ORIGIN
        sync: false          # Set after Vercel deploy
